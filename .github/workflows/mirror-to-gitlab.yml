name: Mirror GitHub to GitLab

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    if: ${{ vars.GITLAB_MIRROR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clone GitHub refs
        run: git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" mirror.git

      - name: Push refs to GitLab
        env:
          GITLAB_MIRROR_USERNAME: oauth2
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_KERNEL }}
        run: |
          cat > "$RUNNER_TEMP/gitlab-askpass.sh" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "$GITLAB_MIRROR_USERNAME" ;;
            *Password*) printf '%s\n' "$GITLAB_MIRROR_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/gitlab-askpass.sh"
          git -C mirror.git remote add gitlab "https://gitlab.eduxiji.net/T202610213999841/oskernel2026-teamname.git"
          GIT_ASKPASS="$RUNNER_TEMP/gitlab-askpass.sh" GIT_TERMINAL_PROMPT=0 git -C mirror.git push --mirror gitlab
